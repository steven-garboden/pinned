name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject config from secrets
        run: |
          cat > js/config.js << 'EOF'
          window.PINNED_CONFIG = {
            supabase: {
              url: "${{ secrets.SUPABASE_URL }}",
              anonKey: "${{ secrets.SUPABASE_ANON_KEY }}"
            },
            stripe: {
              publishableKey: "${{ secrets.STRIPE_PUBLISHABLE_KEY }}"
            },
            amplitude: {
              apiKey: "${{ secrets.AMPLITUDE_API_KEY }}"
            },
            siteUrl: "${{ secrets.SITE_URL }}"
          };
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
